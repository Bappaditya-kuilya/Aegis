name: Windows native

on:
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test portable session parser
        run: cargo test --manifest-path ext/session/Cargo.toml

      - name: Test portable capture and native CLI
        run: |
          cargo test --manifest-path aegis-protocol/Cargo.toml
          cargo test --manifest-path aegis-capture/Cargo.toml
          cargo test --manifest-path compat/aegis-capture/Cargo.toml
          cargo test --manifest-path collector/Cargo.toml

      - name: Verify canonical cross-platform source layout
        shell: pwsh
        run: |
          $manifests = @(
            "aegis-protocol/Cargo.toml",
            "ext/session/Cargo.toml",
            "ext/pprof/Cargo.toml",
            "ext/vis/Cargo.toml"
          )
          foreach ($manifest in $manifests) {
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "missing canonical manifest: $manifest"
            }
          }

      - name: Test frontend shell and web extensions
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test:workers
          npm --prefix frontend run build

      - name: Build and smoke test aegis.exe
        shell: pwsh
        run: |
          cargo build --manifest-path collector/Cargo.toml
          $aegis = "collector/target/debug/aegis.exe"
          & $aegis --version

          $env:HOME = Join-Path $env:RUNNER_TEMP "aegis-home"
          $fixtureDir = Join-Path $env:HOME ".codex/sessions/2026/06/18"
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          $fixturePath = Join-Path $fixtureDir "public-agentpprof-fixture.jsonl"
          Get-Content "ext/pprof/examples/codex/sessions/2026/06/18/public-agentpprof-fixture.jsonl" |
            ForEach-Object {
              $record = $_ | ConvertFrom-Json
              if ($record.payload.cwd) {
                $record.payload.cwd = $PWD.Path
              }
              $record | ConvertTo-Json -Compress -Depth 100
            } |
            Set-Content -Encoding utf8NoBOM $fixturePath
          $snapshotPath = Join-Path $env:RUNNER_TEMP "aegis-snapshot.json"
          & $aegis report --local export --output $snapshotPath
          if ($LASTEXITCODE -ne 0) {
            throw "aegis report --local export failed"
          }
          $snapshot = Get-Content -Raw $snapshotPath | ConvertFrom-Json
          if (-not ($snapshot.sessions | Where-Object agent_type -eq "codex")) {
            throw "aegis report export did not discover the Windows Codex fixture"
          }

          & $aegis top --plain --once
          if ($LASTEXITCODE -ne 0) {
            throw "aegis top failed"
          }
          $visHtml = Join-Path $env:RUNNER_TEMP "agent-nebula.html"
          $visPng = Join-Path $env:RUNNER_TEMP "agent-nebula.png"
          & $aegis vis . --output $visHtml --output $visPng
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $visHtml) -or -not (Test-Path $visPng)) {
            throw "aegis vis browser smoke failed"
          }
          if (-not (Select-String -Quiet -SimpleMatch "agentpprof/src/main.rs" $visHtml)) {
            throw "aegis vis did not render the Windows session fixture"
          }

          $fakeBin = Join-Path $env:RUNNER_TEMP "aegis-fake-provider"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          @'
          @echo off
          node "%~dp0\codex.js" %*
          '@ | Set-Content -Encoding ascii (Join-Path $fakeBin "codex.cmd")
          @'
          const readline = require("readline");
          const lines = readline.createInterface({ input: process.stdin });
          lines.on("line", (line) => {
            const request = JSON.parse(line);
            if (request.id === 1 || request.id === 2) {
              console.log(JSON.stringify({ id: request.id, result: {} }));
            } else if (request.method === "turn/start") {
              console.log(JSON.stringify({ id: request.id, result: { turn: { id: "fake-turn" } } }));
              setTimeout(() => process.exit(0), 100);
            }
          });
          '@ | Set-Content -Encoding utf8NoBOM (Join-Path $fakeBin "codex.js")
          $env:PATH = "$fakeBin;$env:PATH"

          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $listener.Start()
          $bindPort = $listener.LocalEndpoint.Port
          $listener.Stop()
          $bindOut = Join-Path $env:RUNNER_TEMP "aegis-bind.out"
          $bindErr = Join-Path $env:RUNNER_TEMP "aegis-bind.err"
          $bindProcess = Start-Process `
            -FilePath $aegis `
            -ArgumentList @(
              "--listen", "127.0.0.1", "bind", "--no-open",
              "--server-port", "$bindPort", "--app-url", "http://127.0.0.1:17400/"
            ) `
            -RedirectStandardOutput $bindOut `
            -RedirectStandardError $bindErr `
            -PassThru
          try {
            $bindBase = "http://127.0.0.1:$bindPort"
            $tokenPath = Join-Path $env:APPDATA "aegis/access-token"
            $ready = $false
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              if ($bindProcess.HasExited) {
                throw "aegis bind exited during startup"
              }
              if (Test-Path $tokenPath) {
                try {
                  $publicInfo = Invoke-RestMethod -Uri "$bindBase/api/v1/info"
                  if ($publicInfo.authorization_required -and -not $publicInfo.node) {
                    $ready = $true
                    break
                  }
                } catch {
                  # The listener may not have started yet.
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              throw "aegis bind did not expose its authenticated API"
            }

            $snapshotProbe = Invoke-WebRequest `
              -Uri "$bindBase/api/v1/snapshot" `
              -SkipHttpErrorCheck
            if ([int]$snapshotProbe.StatusCode -ne 401) {
              throw "aegis bind exposed session data without a token"
            }
            $token = (Get-Content -Raw $tokenPath).Trim()
            $headers = @{ Authorization = "Bearer $token" }
            $info = Invoke-RestMethod -Uri "$bindBase/api/v1/info" -Headers $headers
            if (-not $info.node -or -not $info.capabilities.session_messages) {
              throw "aegis bind returned incomplete Node capabilities"
            }
            $messageProbe = Invoke-WebRequest `
              -Uri "$bindBase/api/v1/sessions/agentpprof-public-fixture-session/messages" `
              -Method Post `
              -Headers $headers `
              -ContentType "application/json" `
              -Body '{"message":"windows bind smoke"}' `
              -SkipHttpErrorCheck
            $principal = [Security.Principal.WindowsPrincipal]::new(
              [Security.Principal.WindowsIdentity]::GetCurrent()
            )
            $elevated = $principal.IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
            )
            if ($elevated) {
              if ([int]$messageProbe.StatusCode -ne 502 -or
                  $messageProbe.Content -notmatch "elevated Windows") {
                throw "elevated aegis bind did not fail closed before starting the provider"
              }
            } elseif ([int]$messageProbe.StatusCode -ne 202) {
              throw "aegis bind did not submit through the Windows codex.cmd shim"
            }
          } finally {
            if (-not $bindProcess.HasExited) {
              Stop-Process -Id $bindProcess.Id -Force
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows-x86_64
          path: collector/target/debug/aegis.exe
