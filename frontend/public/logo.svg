<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aegis">
  <defs>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e7fa"/>
      <stop offset="0.55" stop-color="#93b7e0"/>
      <stop offset="1" stop-color="#4e7fbf"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c4e"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#1fae9b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- left leg of the A -->
  <path d="M256 36 L326 64 L158 478 L52 478 Z" fill="url(#leg)"/>
  <!-- right leg of the A -->
  <path d="M256 36 L342 36 L460 478 L352 478 Z" fill="url(#dark)"/>
  <!-- teal facet inside the right leg -->
  <path d="M290 96 L342 60 L398 268 L316 236 Z" fill="url(#teal)" opacity="0.92"/>
  <!-- dark center wedge between the legs -->
  <path d="M256 150 L318 478 L194 478 Z" fill="url(#dark)"/>
  <!-- green node network -->
  <g stroke="#2fe06b" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M256 148 L256 372"/>
    <path d="M112 252 L316 252"/>
    <path d="M316 252 L356 252 Q384 252 384 224 L384 196"/>
  </g>
  <circle cx="256" cy="148" r="30" fill="#2fe06b"/>
  <circle cx="256" cy="372" r="22" fill="#2fe06b"/>
  <circle cx="256" cy="308" r="9" fill="#2fe06b"/>
  <circle cx="256" cy="336" r="7" fill="#2fe06b"/>
  <circle cx="112" cy="252" r="26" fill="#39e6d2" stroke="#0a1730" stroke-width="10"/>
  <rect x="360" y="140" width="48" height="60" rx="12" fill="#2fe06b"/>
</svg>
