[package]
name = "aegis-protocol"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
description = "Shared Aegis Node protocol for native, CLI, and browser WASM clients."
license = "MIT"
repository = "https://github.com/aegis-oss/agentsight"
homepage = "https://github.com/aegis-oss/agentsight/tree/master/aegis-protocol"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
